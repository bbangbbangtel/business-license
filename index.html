<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업자등록증</title>
  <meta name="description" content="해성통신 사업자등록증 확인 페이지">
  <style>
    body{
      margin:0;
      font-family:Arial, "Noto Sans KR", sans-serif;
      background:#f7f7f7;
      color:#222;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }
    .wrap{
      width:min(92%, 760px);
      text-align:center;
      background:#fff;
      padding:28px;
      border-radius:16px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }
    h1{font-size:28px;margin:0 0 20px;}
    a{
      display:inline-block;
      font-size:20px;
      font-weight:700;
      color:#0b57d0;
      text-decoration:none;
      margin-bottom:20px;
    }
    a:hover{text-decoration:underline;}
    img{
      width:100%;
      height:auto;
      border:1px solid #ddd;
      border-radius:8px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>사업자등록증</h1>
    <a href="business-license.jpg" target="_blank" rel="noopener">사업자등록증</a>
    <br>
    <img src="business-license.jpg" alt="해성통신 사업자등록증">
  </main>
</body>
</html>
